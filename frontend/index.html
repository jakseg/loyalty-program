<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Concert Reward DApp</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #message { margin-top: 20px; font-size: 16px; color: green; }
        .tier-button {
            margin: 10px;
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .basic-btn {
            background: #007bff;
            color: white;
        }
        .premium-btn {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #333;
            font-weight: bold;
        }
        .tier-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>🎵 Concert Rewards and Loyalty DApp</h1>
    
    <button onclick="connectWallet()">Connect MetaMask</button>
    <br><br>
    
    <h3>Choose Your Reward Tier:</h3>
    <button class="tier-button basic-btn" onclick="redeemBasicReward()">
        🎫 Redeem Basic Reward
    </button>
    <button class="tier-button premium-btn" onclick="redeemPremiumReward()">
        💎 Redeem Premium Reward
    </button>
    
    <p id="message"></p>
    
    <!-- ✅ Load your main logic as a module -->
    <script type="module" src="./script.js"></script>
</body>
</html>
